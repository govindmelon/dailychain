name: Build Android APK

# Builds the phone app on GitHub's machines and attaches the APK to the run.
# Run it by hand from the Actions tab ("Run workflow"), or it runs on every push to main.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Ensure Android SDK components and accept licenses
        run: |
          # Resolve ANDROID_SDK_ROOT (some runners set ANDROID_HOME)
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # Prefer 'latest' cmdline-tools path but fall back to known path on the runner
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          # Install the exact components the project needs (compileSdkVersion=36)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # Accept all licenses
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests that need no phone
        run: node --test test/core.test.js test/sync.test.js mobile/test/*.test.js

      - name: Install and prepare the web part
        working-directory: mobile
        run: |
          npm ci
          npm run web

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the APK is signed
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          head -5 certs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kept-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
